<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Вход - AntiSocial Panel</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            margin: 0;
            background:
                radial-gradient(circle at top left, rgba(139, 92, 246, 0.14), transparent 34rem),
                linear-gradient(180deg, #050507 0%, #090911 100%);
            color: #f4f1ff;
            font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            display: grid;
            place-items: center;
            padding: 18px;
        }

        body::before {
            content: "";
            position: fixed;
            inset: 0;
            pointer-events: none;
            background: linear-gradient(90deg, rgba(255, 255, 255, 0.018) 1px, transparent 1px),
                        linear-gradient(rgba(255, 255, 255, 0.018) 1px, transparent 1px);
            background-size: 42px 42px;
            opacity: 0.45;
        }

        .login-container {
            position: relative;
            z-index: 1;
            width: min(410px, 100%);
            border: 1px solid #29243a;
            border-radius: 8px;
            background: #0e0d16;
            box-shadow: 0 26px 70px rgba(0, 0, 0, 0.54);
            padding: 26px;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 24px;
        }

        .brand-mark {
            width: 42px;
            height: 42px;
            border-radius: 8px;
            display: grid;
            place-items: center;
            background: #130f22;
            border: 1px solid #3f3560;
            color: #8b5cf6;
            font-weight: 900;
            box-shadow: inset 0 0 22px rgba(139, 92, 246, 0.18);
        }

        h1 {
            margin: 0;
            font-size: 23px;
            line-height: 1;
            font-weight: 900;
        }

        .subtitle {
            margin-top: 5px;
            color: #8d83a8;
            font-size: 13px;
        }

        .error {
            margin-bottom: 16px;
            border: 1px solid rgba(216, 79, 104, 0.42);
            border-radius: 8px;
            background: rgba(216, 79, 104, 0.12);
            color: #ffd5dd;
            padding: 12px;
            font-size: 13px;
            font-weight: 800;
        }

        .form-group {
            margin-bottom: 15px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: #c9c0e4;
            font-size: 13px;
            font-weight: 800;
        }

        input[type="password"] {
            width: 100%;
            min-height: 44px;
            border: 1px solid #29243a;
            border-radius: 8px;
            background: #0a0910;
            color: #f4f1ff;
            padding: 0 12px;
            outline: none;
        }

        input[type="password"]:focus {
            border-color: rgba(139, 92, 246, 0.65);
            box-shadow: 0 0 0 3px rgba(139, 92, 246, 0.14);
        }

        button {
            width: 100%;
            min-height: 44px;
            border: 1px solid rgba(139, 92, 246, 0.5);
            border-radius: 8px;
            background: rgba(139, 92, 246, 0.16);
            color: #ffffff;
            font-size: 14px;
            font-weight: 900;
            cursor: pointer;
        }

        button:hover {
            background: rgba(139, 92, 246, 0.24);
        }
    </style>
</head>
<body>
    <main class="login-container">
        <div class="brand">
            <div class="brand-mark">A</div>
            <div>
                <h1>AntiSocial Panel</h1>
                <div class="subtitle">Закрытая панель управления ботом</div>
            </div>
        </div>
        {% if error %}
        <div class="error">{{ error }}</div>
        {% endif %}
        <form method="POST">
            <div class="form-group">
                <label for="password">Пароль администратора</label>
                <input type="password" id="password" name="password" required autofocus autocomplete="current-password">
            </div>
            <button type="submit">Войти</button>
        </form>
    </main>
</body>
</html>
